name: Adaptive icons smoke check

on:
  push:
    branches: [main]
    paths:
      - 'home/yargc/packages/Cargo.toml'
      - 'home/yargc/packages/Cargo.lock'
      - 'home/yargc/packages/vesper-icon-*.rs'
      - 'home/yargc/packages/vesper-icons.rs'
      - 'home/yargc/packages/vesper-icon-*.patch'
      - 'home/yargc/packages/vesper-icons-*.patch'
      - 'home/yargc/packages/vesper-control.rs'
      - 'home/yargc/packages/vesper-control-router.rs'
      - 'home/yargc/packages/vesper-control-*.patch'
      - 'home/yargc/packages/vesper-control.nix'
      - 'home/yargc/packages/VesperThemeSettings.qml'
      - 'home/yargc/packages/AiPage.qml'
      - 'home/yargc/packages/VesperAppControls.qml'
      - 'home/yargc/packages/caelestia-ai-hub.patch'
      - '.github/workflows/adaptive-icons-smoke.yml'
  pull_request:
    paths:
      - 'home/yargc/packages/Cargo.toml'
      - 'home/yargc/packages/Cargo.lock'
      - 'home/yargc/packages/vesper-icon-*.rs'
      - 'home/yargc/packages/vesper-icons.rs'
      - 'home/yargc/packages/vesper-icon-*.patch'
      - 'home/yargc/packages/vesper-icons-*.patch'
      - 'home/yargc/packages/vesper-control.rs'
      - 'home/yargc/packages/vesper-control-router.rs'
      - 'home/yargc/packages/vesper-control-*.patch'
      - 'home/yargc/packages/vesper-control.nix'
      - 'home/yargc/packages/VesperThemeSettings.qml'
      - 'home/yargc/packages/AiPage.qml'
      - 'home/yargc/packages/VesperAppControls.qml'
      - 'home/yargc/packages/caelestia-ai-hub.patch'

permissions:
  contents: read

jobs:
  icon-crate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject bulk export regression
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'export-all|Export all icons' home/yargc/packages; then
            echo 'bulk adaptive-icon export must not be reintroduced' >&2
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Apply production icon patches, compile and test
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vesper-icons"
          cp -R home/yargc/packages "$work"
          chmod -R u+w "$work"
          cd "$work"

          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gnupatch -c bash -c '
            set -euo pipefail
            patch vesper-icons.rs < vesper-icons-source-guard.patch
            patch vesper-icons.rs < vesper-icons-material-axis.patch
            patch vesper-icons.rs < vesper-icons-format-support.patch
            patch vesper-icons.rs < vesper-icons-appstream-recovery.patch
            patch vesper-icons.rs < vesper-icons-grid-recipe.patch
            patch vesper-icons.rs < vesper-icons-state-db.patch
            patch vesper-icon-queue.rs < vesper-icon-queue-inventory-db.patch
            patch vesper-icon-worker.rs < vesper-icon-worker-provider-defaults.patch
            patch vesper-icon-worker.rs < vesper-icon-worker-validation.patch
            cargo check --locked
            cargo test --locked
          '

      - name: Compile routed control
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vesper-control"
          mkdir -p "$work"
          cp home/yargc/packages/vesper-control.rs "$work/vesper-control.rs"
          cp home/yargc/packages/vesper-control-router.rs "$work/vesper-control-router.rs"
          cp home/yargc/packages/vesper-control-wifi-qr.patch "$work/"
          cd "$work"

          nix shell nixpkgs#rustc nixpkgs#gnupatch -c bash -c '
            set -euo pipefail
            patch vesper-control.rs < vesper-control-wifi-qr.patch
            rustc --edition=2021 vesper-control.rs -o vesper-control-core
            rustc --edition=2021 vesper-control-router.rs -o vesper-control
          '

      - name: Validate Caelestia patch syntax
        shell: bash
        run: git apply --numstat home/yargc/packages/caelestia-ai-hub.patch >/dev/null
