name: Adaptive icons smoke check

on:
  push:
    branches: [main]
    paths:
      - 'home/yargc/packages/Cargo.toml'
      - 'home/yargc/packages/Cargo.lock'
      - 'home/yargc/packages/tests/**'
      - 'home/yargc/packages/vesper-icon-*.rs'
      - 'home/yargc/packages/vesper-icons.rs'
      - 'home/yargc/packages/vesper-control.rs'
      - 'home/yargc/packages/vesper-control-router.rs'
      - 'home/yargc/packages/vesper-control.nix'
      - 'home/yargc/packages/VesperThemeSettings.qml'
      - 'home/yargc/packages/VesperVicinaeSettings.qml'
      - 'home/yargc/packages/AiPage.qml'
      - 'home/yargc/packages/VesperAppControls.qml'
      - 'home/yargc/packages/caelestia-ai-hub.patch'
      - '.github/workflows/adaptive-icons-smoke.yml'
  pull_request:
    paths:
      - 'home/yargc/packages/Cargo.toml'
      - 'home/yargc/packages/Cargo.lock'
      - 'home/yargc/packages/tests/**'
      - 'home/yargc/packages/vesper-icon-*.rs'
      - 'home/yargc/packages/vesper-icons.rs'
      - 'home/yargc/packages/vesper-control.rs'
      - 'home/yargc/packages/vesper-control-router.rs'
      - 'home/yargc/packages/vesper-control.nix'
      - 'home/yargc/packages/VesperThemeSettings.qml'
      - 'home/yargc/packages/VesperVicinaeSettings.qml'
      - 'home/yargc/packages/AiPage.qml'
      - 'home/yargc/packages/VesperAppControls.qml'
      - 'home/yargc/packages/caelestia-ai-hub.patch'

permissions:
  contents: read

jobs:
  icon-crate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject bulk export regression
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'export-all|Export all icons' home/yargc/packages; then
            echo 'bulk adaptive-icon export must not be reintroduced' >&2
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Compile and test production icon sources
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vesper-icons"
          cp -R home/yargc/packages "$work"
          chmod -R u+w "$work"
          cd "$work"

          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#sqlite -c bash -c '
            set -euo pipefail
            cargo check --locked
            cargo test --locked
          '

      - name: Compile routed control
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vesper-control"
          mkdir -p "$work"
          cp home/yargc/packages/vesper-control.rs "$work/vesper-control.rs"
          cp home/yargc/packages/vesper-control-router.rs "$work/vesper-control-router.rs"
          cd "$work"

          nix shell nixpkgs#rustc -c bash -c '
            set -euo pipefail
            rustc --edition=2021 vesper-control.rs -o vesper-control-core
            rustc --edition=2021 vesper-control-router.rs -o vesper-control
          '

          fake_bin="$RUNNER_TEMP/fake-flatpak-bin"
          mkdir -p "$fake_bin"
          cat > "$fake_bin/flatpak" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "$*" in
            "info --user org.example.App") exit 0 ;;
            "uninstall --user -y org.example.App") printf '%s\n' "$*" > "$VESPER_FLATPAK_TEST_LOG" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$fake_bin/flatpak"
          export VESPER_FLATPAK_TEST_LOG="$RUNNER_TEMP/flatpak-command.log"
          PATH="$fake_bin:$PATH" ./vesper-control-core app-remove org.example.App.desktop
          grep -Fx 'uninstall --user -y org.example.App' "$VESPER_FLATPAK_TEST_LOG"

          vicinae_home="$RUNNER_TEMP/vicinae-home"
          vicinae_data="$vicinae_home/.local/share"
          mkdir -p "$vicinae_home"
          HOME="$vicinae_home" XDG_CONFIG_HOME="$vicinae_home/.config" XDG_DATA_HOME="$vicinae_data" XDG_STATE_HOME="$vicinae_home/.local/state" ./vesper-control-core vicinae-sync-theme
          jq -e '.followTheme == true and .followIcons == true and .useGlass == true and .accent == "#89b4fa"' \
            <(HOME="$vicinae_home" XDG_CONFIG_HOME="$vicinae_home/.config" XDG_DATA_HOME="$vicinae_data" XDG_STATE_HOME="$vicinae_home/.local/state" ./vesper-control-core vicinae-status)
          jq -e '.theme.dark.name == "vesper-dark" and .theme.dark.icon_theme == "Vesper-Adaptive" and .launcher_window.opacity == 0.92' \
            "$vicinae_home/.config/vicinae/vesper.json"
          test -s "$vicinae_data/vicinae/themes/vesper-dark.toml"
          grep -F 'accent = "#89b4fa"' "$vicinae_data/vicinae/themes/vesper-dark.toml"

      - name: Validate Caelestia patch syntax
        shell: bash
        run: git apply --numstat home/yargc/packages/caelestia-ai-hub.patch >/dev/null
