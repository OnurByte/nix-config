name: Patch smoke check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: patch-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Validate unified diff syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' patch_file; do
            echo "checking $patch_file"
            git apply --numstat "$patch_file" >/dev/null
          done < <(find home/yargc/packages -maxdepth 1 -type f -name '*.patch' -print0)

      - name: Compile and exercise patched Vesper control plane
        shell: bash
        run: |
          nix shell nixpkgs#rustc nixpkgs#gnupatch nixpkgs#jq -c bash -c '
            set -euo pipefail
            cp home/yargc/packages/vesper-control.rs /tmp/vesper-control.rs
            cp home/yargc/packages/vesper-provider-registry.rs /tmp/vesper-provider-registry.rs
            patch /tmp/vesper-control.rs < home/yargc/packages/vesper-control-provider-registry.patch
            patch /tmp/vesper-control.rs < home/yargc/packages/vesper-control-wifi-qr.patch
            patch /tmp/vesper-control.rs < home/yargc/packages/vesper-control-wellbeing.patch
            patch /tmp/vesper-control.rs < home/yargc/packages/vesper-control-credential-aliases.patch
            patch /tmp/vesper-control.rs < home/yargc/packages/vesper-control-wellbeing-toggle.patch
            rustc --edition=2021 /tmp/vesper-control.rs -o /tmp/vesper-control

            export HOME="$TMPDIR/vesper-test-home"
            export XDG_CONFIG_HOME="$HOME/.config"
            export XDG_STATE_HOME="$HOME/.local/state"
            mkdir -p "$HOME"

            test "$(/tmp/vesper-control wellbeing status)" = on
            /tmp/vesper-control wellbeing off
            test "$(/tmp/vesper-control wellbeing status)" = off
            /tmp/vesper-control wellbeing on
            test "$(/tmp/vesper-control wellbeing status)" = on
            /tmp/vesper-control wellbeing-summary | jq -e ".totalSeconds == 0 and (.apps | type == \"array\")" >/dev/null
          '
