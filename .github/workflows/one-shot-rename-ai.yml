name: One-shot rename AI sources

on:
  push:
    branches: [vesper-control-plane-phase2]
    paths:
      - .github/workflows/one-shot-rename-ai.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: vesper-control-plane-phase2
          fetch-depth: 0

      - name: Materialize AI names
        shell: bash
        run: |
          set -euo pipefail
          cp home/yargc/packages/ai-hub.rs home/yargc/packages/ai.rs
          sed -i \
            -e 's/vesper-ai-hub/vesper-ai/g' \
            -e 's/VESPER_AI_HUB_JQ_FILTER/VESPER_AI_JQ_FILTER/g' \
            -e 's/VESPER_AI_HUB_CODEXBAR_TIMEOUT/VESPER_AI_CODEXBAR_TIMEOUT/g' \
            -e 's/VESPER_AI_HUB_MAX_AGE/VESPER_AI_MAX_AGE/g' \
            -e 's/AI Hub refresh lock/AI refresh lock/g' \
            home/yargc/packages/ai.rs

          cp home/yargc/packages/ai-hub.jq home/yargc/packages/ai.jq
          cp home/yargc/packages/AiHub.qml home/yargc/packages/Ai.qml
          sed -i -e 's/@aiHub@/@ai@/g' home/yargc/packages/Ai.qml

          cp home/yargc/packages/caelestia-ai-hub.patch home/yargc/packages/caelestia-ai.patch
          sed -i \
            -e 's/aiHubComponent/aiComponent/g' \
            -e 's/AiHub {}/Ai {}/g' \
            home/yargc/packages/caelestia-ai.patch

          git diff --check -- home/yargc/packages/ai.rs home/yargc/packages/Ai.qml home/yargc/packages/caelestia-ai.patch
          ! grep -E 'AI Hub|Vesper Hub|VESPER_AI_HUB|vesper-ai-hub' home/yargc/packages/ai.rs

      - name: Commit new sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            home/yargc/packages/ai.rs \
            home/yargc/packages/ai.jq \
            home/yargc/packages/Ai.qml \
            home/yargc/packages/caelestia-ai.patch
          git commit -m "ai: materialize AI-only source naming"
          git push origin HEAD:vesper-control-plane-phase2
