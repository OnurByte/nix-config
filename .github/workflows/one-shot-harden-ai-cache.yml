name: One-shot harden AI cache

on:
  push:
    branches: [vesper-control-plane-phase2]
    paths:
      - .github/workflows/one-shot-harden-ai-cache.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: vesper-control-plane-phase2
          fetch-depth: 0

      - name: Harden AI cache
        shell: bash
        run: |
          set -euo pipefail
          file=home/yargc/packages/ai.rs

          perl -0pi -e 's/use std::io::\{Read, Write\};\n/use std::io::{Read, Write};\nuse std::os::unix::fs::{OpenOptionsExt, PermissionsExt};\n/' "$file"

          perl -0pi -e 's/fs::create_dir_all\(parent\)\.map_err\(\|error\| error\.to_string\(\)\)\?;\n    let tmp = parent\.join/fs::create_dir_all(parent).map_err(|error| error.to_string())?;\n    fs::set_permissions(parent, fs::Permissions::from_mode(0o700))\n        .map_err(|error| error.to_string())?;\n    let tmp = parent.join/' "$file"

          perl -0pi -e 's/fs::write\(&tmp, format!\("\{value\}\\n"\)\)\.map_err\(\|error\| error\.to_string\(\)\)\?;\n    fs::rename/fs::write(\&tmp, format!("{value}\\n")).map_err(|error| error.to_string())?;\n    fs::set_permissions(\&tmp, fs::Permissions::from_mode(0o600))\n        .map_err(|error| error.to_string())?;\n    fs::rename/' "$file"

          perl -0pi -e 's/OpenOptions::new\(\)\.write\(true\)\.create_new\(true\)\.open\(path\)/OpenOptions::new().write(true).create_new(true).mode(0o600).open(path)/g' "$file"

          perl -0pi -e 's/let _ = fs::create_dir_all\(&root\);\n/let _ = fs::create_dir_all(\&root);\n    let _ = fs::set_permissions(\&root, fs::Permissions::from_mode(0o700));\n/' "$file"

          git diff --check -- "$file"
          grep -F 'OpenOptionsExt, PermissionsExt' "$file" >/dev/null
          grep -F 'mode(0o600)' "$file" >/dev/null
          grep -F 'from_mode(0o700)' "$file" >/dev/null

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/yargc/packages/ai.rs
          git commit -m "ai: keep local snapshot cache private"
          git push origin HEAD:vesper-control-plane-phase2
