name: One-shot harden Wi-Fi QR

on:
  push:
    branches: [vesper-control-plane-phase2]
    paths:
      - .github/workflows/one-shot-harden-wifi-qr.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: vesper-control-plane-phase2
          fetch-depth: 0

      - name: Harden generated QR storage
        shell: bash
        run: |
          set -euo pipefail
          file=home/yargc/packages/vesper-control.rs

          perl -0pi -e 's/fs::create_dir_all\(&root\)\.map_err\(\|error\| error\.to_string\(\)\)\?;\n    let path = root\.join\("wifi-share\.svg"\);/fs::create_dir_all(\&root).map_err(|error| error.to_string())?;\n    fs::set_permissions(\&root, fs::Permissions::from_mode(0o700))\n        .map_err(|error| error.to_string())?;\n    let path = root.join("wifi-share.svg");/' "$file"

          perl -0pi -e 's/if !result\.status\.success\(\) \{\n        return Err\(String::from_utf8_lossy\(&result\.stderr\)\.trim\(\)\.to_string\(\)\);\n    \}\n    Ok\(path\)\n\}/if !result.status.success() {\n        return Err(String::from_utf8_lossy(\&result.stderr).trim().to_string());\n    }\n    fs::set_permissions(\&path, fs::Permissions::from_mode(0o600))\n        .map_err(|error| error.to_string())?;\n    Ok(path)\n}/' "$file"

          git diff --check -- "$file"
          grep -F 'root, fs::Permissions::from_mode(0o700)' "$file" >/dev/null
          grep -F 'path, fs::Permissions::from_mode(0o600)' "$file" >/dev/null

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/yargc/packages/vesper-control.rs
          git commit -m "network: keep Wi-Fi QR payload private on disk"
          git push origin HEAD:vesper-control-plane-phase2
