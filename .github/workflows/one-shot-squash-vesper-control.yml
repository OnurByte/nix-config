name: One-shot squash Vesper control

on:
  push:
    branches: [vesper-control-plane-phase2]
    paths:
      - .github/workflows/one-shot-squash-vesper-control.yml

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: vesper-control-plane-phase2
          fetch-depth: 0

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail
          source_file=home/yargc/packages/vesper-control.rs
          cp "$source_file" /tmp/vesper-control.rs
          patches=(
            vesper-control-provider-registry.patch
            vesper-control-dpi.patch
            vesper-control-proxy-hardening.patch
            vesper-control-wifi-qr.patch
            vesper-control-wellbeing.patch
            vesper-control-wellbeing-private.patch
            vesper-control-app-permissions.patch
            vesper-control-credential-aliases.patch
            vesper-control-exec-separator.patch
            vesper-control-wellbeing-toggle.patch
          )
          for patch_name in "${patches[@]}"; do
            echo "applying $patch_name"
            patch --batch /tmp/vesper-control.rs < "home/yargc/packages/$patch_name"
          done
          cp /tmp/vesper-control.rs "$source_file"
          git diff --check -- "$source_file"
          grep -F 'include!("vesper-provider-registry.rs")' "$source_file" >/dev/null
          grep -F 'nfqws2@default.service' "$source_file" >/dev/null
          grep -F 'from_mode(0o600)' "$source_file" >/dev/null
          grep -F 'credential exec' "$source_file" >/dev/null

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- home/yargc/packages/vesper-control.rs; then
            echo "source already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/yargc/packages/vesper-control.rs
          git commit -m "vesper-control: squash validated first-party patches"
          git push origin HEAD:vesper-control-plane-phase2
