name: Nix smoke check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nix-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nix-bin rustc jq lua5.4
          sudo systemctl stop nix-daemon.socket nix-daemon.service 2>/dev/null || true
          sudo chown -R "$USER":"$(id -gn)" /nix
          mkdir -p "$HOME/.config/nix"
          printf '%s\n' \
            'experimental-features = nix-command flakes' \
            'sandbox = false' \
            > "$HOME/.config/nix/nix.conf"
          echo 'NIX_REMOTE=local' >> "$GITHUB_ENV"
          NIX_REMOTE=local nix --version
          rustc --version
          jq --version
          /usr/bin/luac5.4 -v

      - name: Reject first-party Python
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(find . -type f -name '*.py' -not -path './.git/*' -print)
          if [ "${#python_files[@]}" -ne 0 ]; then
            printf 'Vesper first-party Python is forbidden:\n%s\n' "${python_files[*]}" >&2
            exit 1
          fi

      - name: Parse every Nix file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "parsing $file"
            nix-instantiate --parse "$file" >/dev/null
          done < <(find . -name '*.nix' -print0)

      - name: Check AI Hub Rust backend
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --emit=metadata home/yargc/packages/ai-hub.rs -o /tmp/vesper-ai-hub.rmeta
          printf "%s\n%s\n%s\n%s\n" \
            "{\"host\":{},\"providers\":[]}" \
            "{\"count\":0,\"agents\":[]}" \
            "{\"unread\":0,\"high\":0}" \
            "{\"state\":\"ok\"}" \
            | jq -s -e -f home/yargc/packages/ai-hub.jq >/dev/null

      - name: Check Vesper settings Rust bridge
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --emit=metadata home/yargc/packages/vesper-settings.rs -o /tmp/vesper-settings.rmeta

      - name: Check Hermes Rust control plane
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 home/yargc/packages/hermes-rs/main.rs -o /tmp/vesper-hermes-core
          ln -sf /tmp/vesper-hermes-core /tmp/vesper-hermes
          ln -sf /tmp/vesper-hermes-core /tmp/vesper-hermes-automations
          ln -sf /tmp/vesper-hermes-core /tmp/vesper-research

          registry="$RUNNER_TEMP/hermes-jobs.json"
          state="$RUNNER_TEMP/hermes-state"
          briefings="$RUNNER_TEMP/hermes-briefings"
          mkdir -p "$state" "$briefings"
          nix eval --json --file home/yargc/hermes-jobs.nix > "$registry"

          export PATH="/tmp:$PATH"
          export VESPER_HERMES_JOB_REGISTRY="$registry"
          export VESPER_RESEARCH_STATE_DIR="$state"
          export VESPER_BRIEFING_DIR="$briefings"

          /tmp/vesper-hermes-automations validate-registry
          /tmp/vesper-hermes status --json | jq -e ".count == 0 and .unread == 0 and .high == 0" >/dev/null
          /tmp/vesper-research sources | jq -e ".schemaVersion == 1 and .count == 0" >/dev/null

          if /tmp/vesper-hermes-automations tor-fetch "https://example.com/path/.onion" >/dev/null 2>&1; then
            echo "tor-fetch accepted a clearnet authority" >&2
            exit 1
          fi

      - name: Parse Hyprland Lua
        shell: bash
        run: |
          set -euo pipefail
          for file in home/yargc/hypr/*.lua; do
            echo "parsing $file"
            /usr/bin/luac5.4 -p "$file"
          done

      - name: Resolve locked flake inputs
        run: nix flake metadata --no-write-lock-file

      - name: Evaluate Vesper module graph
        run: test "$(nix eval --raw .#nixosConfigurations.vesper.config.networking.hostName)" = vesper

      - name: Evaluate Home Manager activation
        run: nix eval --raw '.#nixosConfigurations.vesper.config.home-manager.users.yargc.home.activationPackage.drvPath' >/dev/null

      - name: Build Caelestia surface
        shell: bash
        run: |
          set +e
          nix build --no-link --print-build-logs \
            '.#nixosConfigurations.vesper.config.home-manager.users.yargc.programs.caelestia.package' \
            >caelestia-build.log 2>&1
          status=$?

          cat caelestia-build.log

          if [ "$status" -ne 0 ]; then
            summary="$(grep -Ei 'error:|failed|failure|hunk|patch|reject|No such file|substitute|CMake Error|qml' caelestia-build.log | tail -n 100)"
            if [ -z "$summary" ]; then
              summary="$(tail -n 100 caelestia-build.log)"
            fi
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Caelestia surface build failed::$summary"
          fi

          exit "$status"

      - name: Build complete Vesper system
        shell: bash
        run: |
          set +e
          nix build --no-link --print-build-logs \
            '.#nixosConfigurations.vesper.config.system.build.toplevel' \
            >vesper-system-build.log 2>&1
          status=$?

          cat vesper-system-build.log

          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 vesper-system-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Vesper full system build failed::$message"
          fi

          exit "$status"

      - name: Build T3 Code Nightly package
        run: nix build --no-link .#t3code-nightly

      - name: Build TurnLens package
        run: nix build --no-link .#turnlens

      - name: Build Cuprate package
        run: nix build --no-link .#cuprated
