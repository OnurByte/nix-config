name: Nix smoke check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Parse every Nix file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "parsing $file"
            nix-instantiate --parse "$file" >/dev/null
          done < <(find . -name '*.nix' -print0)

      - name: Resolve flake inputs
        run: nix flake metadata

      - name: Evaluate kraken module graph
        run: test "$(nix eval --raw .#nixosConfigurations.kraken.config.networking.hostName)" = kraken
