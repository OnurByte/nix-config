name: Nix smoke check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nix-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Parse every Nix file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "parsing $file"
            nix-instantiate --parse "$file" >/dev/null
          done < <(find . -name '*.nix' -print0)

      - name: Parse Hermes automation Python
        run: |
          python3 -m py_compile \
            home/yargc/packages/hermes-runtime.py \
            home/yargc/packages/hermes_automation_common.py \
            home/yargc/packages/hermes_automation_reports.py \
            home/yargc/packages/hermes_automation_scheduler.py \
            home/yargc/packages/hermes_research_collectors.py \
            home/yargc/packages/hermes_tasks_daily.py \
            home/yargc/packages/hermes_tasks_weekly.py \
            home/yargc/packages/hermes_tasks_maintenance.py \
            home/yargc/packages/hermes_automation_tasks.py \
            home/yargc/packages/hermes-automations.py

      - name: Validate Hermes automation graph
        shell: bash
        run: |
          set -euo pipefail
          nix eval --json --expr 'import ./home/yargc/hermes-jobs.nix' > /tmp/hermes-jobs.json
          PYTHONPATH=home/yargc/packages python3 - <<'PY'
          import json
          from hermes_automation_tasks import TASKS

          jobs = json.load(open('/tmp/hermes-jobs.json'))
          watchdogs = {'vesper-health-watch', 'cron-integrity-watch'}
          valid_modes = {'dispatch', 'monitor', 'watchdog'}
          errors = []
          for name, spec in jobs.items():
              mode = spec.get('mode', 'dispatch')
              task = spec.get('task', name)
              if mode not in valid_modes:
                  errors.append(f'{name}: unsupported mode {mode!r}')
              elif mode in {'dispatch', 'monitor'} and task not in TASKS:
                  errors.append(f'{name}: task {task!r} missing from TASKS')
              elif mode == 'watchdog' and task not in watchdogs:
                  errors.append(f'{name}: watchdog {task!r} is not implemented')
              if not spec.get('schedule'):
                  errors.append(f'{name}: missing schedule')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'validated {len(jobs)} Hermes jobs and {len(TASKS)} executable tasks')
          PY

      - name: Parse Hyprland Lua
        shell: bash
        run: |
          set -euo pipefail
          nix shell nixpkgs#lua -c bash -c '
            for file in home/yargc/hypr/*.lua; do
              echo "parsing $file"
              luac -p "$file"
            done
          '

      - name: Resolve locked flake inputs
        run: nix flake metadata --no-write-lock-file

      - name: Evaluate Vesper module graph
        run: test "$(nix eval --raw .#nixosConfigurations.vesper.config.networking.hostName)" = vesper

      - name: Evaluate Home Manager activation
        run: nix eval --raw '.#nixosConfigurations.vesper.config.home-manager.users.yargc.home.activationPackage.drvPath' >/dev/null

      - name: Build complete Vesper system
        shell: bash
        run: |
          set +e
          nix build --no-link --print-build-logs \
            '.#nixosConfigurations.vesper.config.system.build.toplevel' \
            >vesper-system-build.log 2>&1
          status=$?

          cat vesper-system-build.log

          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 vesper-system-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Vesper full system build failed::$message"
          fi

          exit "$status"

      - name: Build T3 Code Nightly package
        run: nix build --no-link .#t3code-nightly

      - name: Build TurnLens package
        run: nix build --no-link .#turnlens

      - name: Build Cuprate package
        run: nix build --no-link .#cuprated

      - name: Build Caelestia surface
        run: nix build --no-link '.#nixosConfigurations.vesper.config.home-manager.users.yargc.programs.caelestia.package'
