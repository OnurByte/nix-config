name: Nix smoke check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nix-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Parse every Nix file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "parsing $file"
            nix-instantiate --parse "$file" >/dev/null
          done < <(find . -name '*.nix' -print0)

      - name: Compile Hermes automation Python
        run: |
          python -m py_compile \
            home/yargc/hermes/automation-support.py \
            home/yargc/hermes/research-collectors.py \
            home/yargc/hermes/bounded-collector.py \
            home/yargc/hermes/automation-fleet.py \
            home/yargc/hermes/upstream-edge-monitor.py \
            home/yargc/hermes/cron-retention.py

      - name: Validate Hermes cron fleet graph
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import types
          from pathlib import Path

          cron_pkg = types.ModuleType("cron")
          jobs_mod = types.ModuleType("cron.jobs")
          jobs_mod.create_job = lambda **kwargs: kwargs
          jobs_mod.list_jobs = lambda **kwargs: []
          jobs_mod.update_job = lambda *args, **kwargs: None
          sys.modules["cron"] = cron_pkg
          sys.modules["cron.jobs"] = jobs_mod

          path = Path("home/yargc/hermes/automation-fleet.py")
          spec = importlib.util.spec_from_file_location("vesper_hermes_fleet", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          fleet = module.jobs()
          names = [job["name"] for job in fleet]
          assert len(names) == len(set(names)), "duplicate Hermes cron job names"
          known = set(names)

          edges = {}
          for job in fleet:
              name = job["name"]
              assert job.get("schedule"), f"{name}: missing schedule"
              assert isinstance(job.get("skills", []), list), f"{name}: skills must be a list"

              if job.get("no_agent"):
                  assert job.get("script"), f"{name}: no_agent requires a script"
                  assert not job.get("monitor_script"), f"{name}: no_agent cannot use monitor_script"

              if job.get("monitor_script"):
                  assert not job.get("script"), f"{name}: monitor and pre-run script must stay separate"
                  assert not job.get("no_agent"), f"{name}: monitor_script requires an agent"

              sources = list(job.get("context_from") or [])
              unknown = [source for source in sources if source not in known]
              assert not unknown, f"{name}: unknown context_from jobs: {unknown}"
              assert name not in sources, f"{name}: self-referential context_from"
              edges[name] = sources

          visiting = set()
          visited = set()

          def visit(name):
              if name in visiting:
                  raise AssertionError(f"context_from cycle detected at {name}")
              if name in visited:
                  return
              visiting.add(name)
              for source in edges[name]:
                  visit(source)
              visiting.remove(name)
              visited.add(name)

          for name in names:
              visit(name)

          print(f"validated {len(fleet)} Hermes cron jobs")
          PY

      - name: Parse Hyprland Lua
        shell: bash
        run: |
          set -euo pipefail
          nix shell nixpkgs#lua -c bash -c '
            for file in home/yargc/hypr/*.lua; do
              echo "parsing $file"
              luac -p "$file"
            done
          '

      - name: Resolve locked flake inputs
        run: nix flake metadata --no-write-lock-file

      - name: Evaluate Vesper module graph
        run: test "$(nix eval --raw .#nixosConfigurations.vesper.config.networking.hostName)" = vesper

      - name: Evaluate Home Manager activation
        run: nix eval --raw '.#nixosConfigurations.vesper.config.home-manager.users.yargc.home.activationPackage.drvPath' >/dev/null

      - name: Build complete Vesper system
        shell: bash
        run: |
          set +e
          nix build --no-link --print-build-logs \
            '.#nixosConfigurations.vesper.config.system.build.toplevel' \
            >vesper-system-build.log 2>&1
          status=$?

          cat vesper-system-build.log

          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 vesper-system-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Vesper full system build failed::$message"
          fi

          exit "$status"

      - name: Build T3 Code Nightly package
        run: nix build --no-link .#t3code-nightly

      - name: Build TurnLens package
        run: nix build --no-link .#turnlens

      - name: Build Cuprate package
        run: nix build --no-link .#cuprated

      - name: Build Caelestia surface
        run: nix build --no-link '.#nixosConfigurations.vesper.config.home-manager.users.yargc.programs.caelestia.package'