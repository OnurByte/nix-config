name: Nix smoke check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nix-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Parse every Nix file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "parsing $file"
            nix-instantiate --parse "$file" >/dev/null
          done < <(find . -name '*.nix' -print0)

      - name: Resolve locked flake inputs
        run: nix flake metadata --no-write-lock-file

      - name: Evaluate kraken module graph
        run: test "$(nix eval --raw .#nixosConfigurations.kraken.config.networking.hostName)" = kraken

      # ZCode is proprietary upstream software; the system config allows
      # unfree packages, while a standalone CI package build must opt in.
      - name: Build ZCode package
        run: NIXPKGS_ALLOW_UNFREE=1 nix build --impure --no-link .#zcode

      - name: Build agentic Caelestia surface
        run: nix build --no-link '.#nixosConfigurations.kraken.config.home-manager.users.yargc.programs.caelestia.package'
